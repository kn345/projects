<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UW Research Network – Shortlist</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #060e1a;
  color: #e8eaf0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Top Nav ── */
.topnav {
  height: 52px;
  background: #0a1628;
  border-bottom: 1px solid #1e3250;
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 10;
}
.topnav-logo { font-size: 14px; font-weight: 700; color: #7ea8c9; letter-spacing: 0.05em; text-transform: uppercase; flex-shrink: 0; }
.topnav-logo span { color: #4ecdc4; }
.topnav-div { width: 1px; height: 24px; background: #1e3250; flex-shrink: 0; }
.topnav-title { font-size: 14px; font-weight: 600; color: #e8eaf0; flex: 1; }
.topnav-actions { display: flex; align-items: center; gap: 10px; }
.view-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
  padding: 5px 14px; border-radius: 20px; border: 1px solid; cursor: pointer;
  transition: all 0.15s; white-space: nowrap;
}
.view-pill.active-res  { color: #7ea8c9; background: rgba(126,168,201,0.08); border-color: rgba(126,168,201,0.3); }
.view-pill.active-ext  { color: #a07ef0; background: rgba(160,126,240,0.10); border-color: rgba(160,126,240,0.35); }
.view-pill.inactive    { color: #4a6580; background: #0f1e35; border-color: #1e3250; }
.view-pill.inactive:hover { color: #7ea8c9; border-color: #7ea8c9; }
.queue-badge {
  font-size: 12px; font-weight: 600; color: #4ecdc4;
  background: rgba(78,205,196,0.1); border: 1px solid rgba(78,205,196,0.25);
  padding: 4px 12px; border-radius: 20px; white-space: nowrap;
}
.queue-badge.dim { color: #4a6580; background: #0f1e35; border-color: #1e3250; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #1a4a6e, #4ecdc4);
  border: 2px solid #1e3250;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
}

/* ── App shell ── */
.app-shell {
  display: grid;
  grid-template-columns: 260px 1fr 320px;
  flex: 1;
  overflow: hidden;
}
.app-shell.two-col { grid-template-columns: 220px 1fr; }

/* ── Sidebar ── */
.sidebar {
  background: #0a1628;
  border-right: 1px solid #1e3250;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.sidebar-section { padding: 18px 16px; border-bottom: 1px solid #1e3250; }
.sidebar-section.push-bottom { margin-top: auto; border-bottom: none; }
.sec-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: #3a5a78; margin-bottom: 12px;
}
.mode-toggle { display: flex; flex-direction: column; gap: 6px; }
.mode-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  border: 1px solid transparent; background: transparent;
  color: #4a6580; font-size: 13px; font-weight: 600;
  cursor: pointer; width: 100%; text-align: left; transition: all 0.15s;
}
.mode-btn:hover { background: #0f1e35; color: #7ea8c9; }
.mode-btn.active { background: #111e35; border-color: rgba(78,205,196,0.3); color: #4ecdc4; }
.mode-btn svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; }
.mode-count {
  margin-left: auto; font-size: 11px;
  background: #0a1628; border: 1px solid #1e3250;
  padding: 1px 7px; border-radius: 10px; color: #4a6580; font-weight: 500;
}
.mode-btn.active .mode-count { background: rgba(78,205,196,0.1); border-color: rgba(78,205,196,0.25); color: #4ecdc4; }
.filter-list { display: flex; flex-direction: column; gap: 4px; }
.filter-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-radius: 8px; border: 1px solid transparent;
  color: #4a6580; font-size: 12px; cursor: pointer; transition: all 0.15s;
}
.filter-item:hover { background: #0f1e35; color: #7ea8c9; }
.filter-item.active { background: rgba(78,205,196,0.07); border-color: rgba(78,205,196,0.2); color: #4ecdc4; }
.filter-count { font-size: 10px; color: #2a4060; }
.filter-item.active .filter-count { color: rgba(78,205,196,0.5); }
.progress-bar { height: 4px; background: #111e30; border-radius: 2px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #1a4a6e, #4ecdc4); border-radius: 2px; transition: width 0.4s ease; }
.progress-meta { display: flex; justify-content: space-between; font-size: 11px; color: #4a6580; margin-top: 6px; }
.kbd-hints { display: flex; flex-direction: column; gap: 6px; }
.kbd-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #4a6580; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 24px; height: 20px; padding: 0 5px;
  background: #0f1e35; border: 1px solid #1e3250; border-radius: 4px;
  font-size: 10px; font-weight: 600; color: #7ea8c9; font-family: monospace;
}

/* ── Main content ── */
.main-content {
  background: #0a1628;
  display: flex; flex-direction: column;
  align-items: stretch;
  overflow: hidden;
  position: relative;
}
/* Scrollable card area — action bar stays outside and always visible */
.card-scroll-area {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 24px 40px 12px;
  gap: 16px;
  min-height: 0;
}
.action-bar-wrapper {
  flex-shrink: 0;
  display: flex; justify-content: center;
  padding: 10px 40px 20px;
  background: #0a1628;
  border-top: 1px solid #0f1e35;
}

/* ── External view banner ── */
.ext-banner {
  width: 100%; max-width: 700px;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: rgba(160,126,240,0.07); border: 1px solid rgba(160,126,240,0.25);
  border-radius: 12px; animation: fadeIn 0.2s ease;
}
.ext-banner-title { font-size: 12px; font-weight: 600; color: #a07ef0; }
.ext-banner-sub { font-size: 12px; color: #7ea8c9; flex: 1; }
.ext-banner-link { font-size: 11px; color: #4a6580; cursor: pointer; text-decoration: underline; white-space: nowrap; }
.ext-banner-link:hover { color: #7ea8c9; }

/* ── Card ── */
.card-wrap { width: 100%; max-width: 700px; position: relative; }
.card {
  width: 100%; background: #0f2040;
  border: 1px solid #1e3a5f; border-radius: 20px;
  overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  transition: box-shadow 0.15s;
}
.card-header { padding: 24px 28px 20px; border-bottom: 1px solid #1a3050; }
.card-header-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 14px;
}
.domain-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: #4ecdc4;
  background: rgba(78,205,196,0.1); border: 1px solid rgba(78,205,196,0.25);
  padding: 4px 12px; border-radius: 20px; flex-shrink: 0;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: #4ecdc4; }
.card-top-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.view-badge-sm {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600;
  padding: 3px 10px; border-radius: 20px; border: 1px solid;
}
.view-badge-sm.res { color: #7ea8c9; background: rgba(126,168,201,0.08); border-color: #1e3250; }
.view-badge-sm.ext { color: #a07ef0; background: rgba(160,126,240,0.1); border-color: rgba(160,126,240,0.3); }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid #1e3250; background: #0a1628;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #4a6580; transition: all 0.15s; font-size: 15px;
}
.icon-btn:hover { border-color: #4ecdc4; color: #4ecdc4; }
.paper-title { font-size: 20px; font-weight: 700; line-height: 1.4; color: #e8eaf0; margin-bottom: 14px; }
.paper-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.meta-chip {
  display: flex; align-items: center; gap: 5px;
  background: #0a1628; border: 1px solid #1e3250;
  padding: 4px 10px; border-radius: 12px; font-size: 12px; color: #7ea8c9;
}
.card-body { padding: 24px 28px; }
.card-body-grid { display: grid; grid-template-columns: 1fr 220px; gap: 24px; align-items: start; }
.body-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #3a5a78; margin-bottom: 10px; }
.abstract-text { font-size: 14px; line-height: 1.7; color: #b0c4d8; margin-bottom: 20px; }
.keywords { display: flex; flex-wrap: wrap; gap: 6px; }
.kw {
  font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 12px;
  background: rgba(30,80,140,0.35); border: 1px solid rgba(78,140,200,0.2); color: #7ea8c9;
}
.kw.hi { background: rgba(78,205,196,0.12); border-color: rgba(78,205,196,0.3); color: #4ecdc4; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.stat-box {
  background: #0a1628; border: 1px solid #1e3250;
  border-radius: 12px; padding: 12px; text-align: center;
}
.stat-box.full { grid-column: span 2; }
.stat-val { font-size: 20px; font-weight: 700; color: #e8eaf0; line-height: 1; margin-bottom: 4px; }
.stat-val.teal { color: #4ecdc4; }
.stat-lbl { font-size: 10px; color: #4a6580; text-transform: uppercase; letter-spacing: 0.08em; }
.author-card {
  background: #0a1628; border: 1px solid #1e3250; border-radius: 12px;
  padding: 14px; display: flex; align-items: center; gap: 12px;
}
.author-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #1e5f4a, #4ecdc4); border: 2px solid #0f2040;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.author-name { font-size: 13px; font-weight: 600; color: #c8dcea; margin-bottom: 2px; }
.author-dept { font-size: 11px; color: #4a6580; }
.author-link { font-size: 11px; color: #4ecdc4; margin-top: 4px; cursor: pointer; }

/* external summary */
.ext-summary {
  background: rgba(160,126,240,0.06); border: 1px solid rgba(160,126,240,0.2);
  border-radius: 12px; padding: 16px; margin-bottom: 20px;
  font-size: 14px; line-height: 1.7; color: #b0c4d8; font-style: italic;
}
.ext-summary-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
  color: #a07ef0; margin-bottom: 8px;
}

/* ── Researcher card specifics ── */
.researcher-hero {
  display: flex; align-items: center; gap: 20px;
  padding: 24px 28px 20px; border-bottom: 1px solid #1a3050;
}
.res-avatar {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, #1a4a6e, #4ecdc4);
  border: 3px solid #4ecdc4;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 700; color: #fff; flex-shrink: 0; position: relative;
}
.online-dot {
  width: 14px; height: 14px; background: #4ecdc4; border-radius: 50%;
  border: 3px solid #0f2040; position: absolute; bottom: 2px; right: 2px;
}
.res-hero-info { flex: 1; min-width: 0; }
.res-hero-info h2 { font-size: 24px; font-weight: 700; color: #e8eaf0; margin-bottom: 4px; }
.res-affil { font-size: 13px; color: #7ea8c9; margin-bottom: 10px; }
.res-badges { display: flex; gap: 8px; flex-wrap: wrap; }
.match-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 700; color: #4ecdc4;
  background: rgba(78,205,196,0.1); border: 1px solid rgba(78,205,196,0.3);
  padding: 4px 12px; border-radius: 12px;
}
.open-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 14px; border: 1px solid;
}
.open-pill.collab    { color: #4ecdc4; border-color: rgba(78,205,196,0.3); background: rgba(78,205,196,0.07); }
.open-pill.industry  { color: #f0a050; border-color: rgba(240,160,80,0.3); background: rgba(240,160,80,0.07); }
.res-body-grid { display: grid; grid-template-columns: 1fr 220px; gap: 24px; align-items: start; }
.why-relevant { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.rel-row {
  display: flex; align-items: flex-start; gap: 12px;
  background: #0a1628; border: 1px solid #1e3250;
  border-radius: 10px; padding: 12px 14px;
}
.rel-num { font-size: 11px; font-weight: 700; color: #2a4060; min-width: 20px; padding-top: 1px; }
.rel-text strong { display: block; font-size: 13px; font-weight: 600; color: #c8dcea; margin-bottom: 3px; }
.rel-text span { font-size: 12px; color: #4a6580; line-height: 1.4; }
.interests-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.int-tag { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 12px; }
.int-tag.primary { background: rgba(78,205,196,0.12); border: 1px solid rgba(78,205,196,0.3); color: #4ecdc4; }
.int-tag.secondary { background: rgba(30,80,140,0.35); border: 1px solid rgba(78,140,200,0.2); color: #7ea8c9; }
.res-stat-col { display: flex; flex-direction: column; gap: 8px; }

/* ── Action bar ── */
.action-bar {
  width: 100%; max-width: 700px;
  display: flex; align-items: center; gap: 14px;
}
.action-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 13px 28px; border-radius: 12px; border: 2px solid;
  background: transparent; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; flex: 1;
}
.action-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
.action-btn.skip  { border-color: #e05c6a; color: #e05c6a; }
.action-btn.skip:hover  { background: rgba(224,92,106,0.08); }
.action-btn.save  { border-color: #4ecdc4; color: #4ecdc4; background: rgba(78,205,196,0.05); }
.action-btn.save:hover  { background: rgba(78,205,196,0.12); }
.action-btn.details { border-color: #1e3250; color: #7ea8c9; flex: 0; padding: 13px 20px; }
.action-btn.details:hover { border-color: #7ea8c9; }
.action-btn.connect { border-color: #4ecdc4; color: #4ecdc4; background: rgba(78,205,196,0.05); }
.action-btn.connect:hover { background: rgba(78,205,196,0.12); }
.action-btn.pass    { border-color: #e05c6a; color: #e05c6a; }
.action-btn.pass:hover    { background: rgba(224,92,106,0.08); }
.kbd-inline {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 18px; padding: 0 4px;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 3px; font-size: 10px; font-family: monospace; opacity: 0.7;
}

/* ── Swipe overlay badges ── */
.swipe-badge {
  position: absolute; top: 28px;
  padding: 8px 20px; border-radius: 10px;
  font-size: 22px; font-weight: 900; letter-spacing: 0.05em;
  border: 3px solid; pointer-events: none; z-index: 10;
  opacity: 0; transition: opacity 0.15s;
}
.swipe-badge.nope { left: 28px; color: #e05c6a; border-color: #e05c6a; transform: rotate(-10deg); }
.swipe-badge.like { right: 28px; color: #4ecdc4; border-color: #4ecdc4; transform: rotate(10deg); }
.swipe-badge.show { opacity: 1; }

/* ── Card animations ── */
@keyframes exitLeft  { to { transform: translateX(-130%) rotate(-8deg); opacity: 0; } }
@keyframes exitRight { to { transform: translateX(130%)  rotate(8deg);  opacity: 0; } }
@keyframes enterCard { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.exit-left  { animation: exitLeft  0.32s ease forwards; }
.exit-right { animation: exitRight 0.32s ease forwards; }
.enter-card { animation: enterCard 0.3s ease; }

/* ── Undo toast ── */
.undo-toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: #1a3050; border: 1px solid #1e3a5f; border-radius: 12px;
  padding: 12px 20px; display: flex; align-items: center; gap: 12px;
  font-size: 13px; color: #7ea8c9; z-index: 100;
  animation: toastIn 0.25s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.undo-btn {
  font-size: 12px; font-weight: 700; color: #4ecdc4; cursor: pointer;
  background: rgba(78,205,196,0.1); border: 1px solid rgba(78,205,196,0.3);
  padding: 4px 12px; border-radius: 8px; transition: all 0.15s;
}
.undo-btn:hover { background: rgba(78,205,196,0.2); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ── Right panel ── */
.right-panel {
  background: #060e1a; border-left: 1px solid #1e3250;
  display: flex; flex-direction: column; overflow: hidden;
}
.rp-header {
  padding: 16px 20px; border-bottom: 1px solid #1e3250;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.rp-header h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #4a6580; }
.panel-count {
  font-size: 12px; font-weight: 600;
  background: rgba(78,205,196,0.1); color: #4ecdc4;
  padding: 2px 10px; border-radius: 10px;
}
.rp-tabs { display: flex; border-bottom: 1px solid #1e3250; flex-shrink: 0; }
.panel-tab {
  flex: 1; padding: 10px; font-size: 12px; font-weight: 600;
  color: #4a6580; text-align: center; cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.15s;
}
.panel-tab.active { color: #4ecdc4; border-bottom-color: #4ecdc4; }
.rp-list {
  flex: 1; overflow-y: auto; padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.rp-empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; padding: 24px; text-align: center; }
.rp-empty-icon { font-size: 32px; }
.rp-empty-text { font-size: 12px; color: #3a5a78; }
.saved-row {
  background: #0a1628; border: 1px solid #1e3250; border-radius: 12px;
  padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px;
  cursor: pointer; transition: border-color 0.15s; animation: fadeIn 0.2s ease;
}
.saved-row:hover { border-color: #4ecdc4; }
.row-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(78,205,196,0.1); border: 1px solid rgba(78,205,196,0.2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px;
}
.row-body { flex: 1; min-width: 0; }
.row-title { font-size: 12px; font-weight: 600; color: #c8dcea; line-height: 1.35; margin-bottom: 4px; }
.row-meta { font-size: 11px; color: #4a6580; }
.row-meta span { color: #4ecdc4; }
.row-remove {
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: none; background: transparent; color: #2a4060;
  cursor: pointer; font-size: 14px; transition: color 0.15s; flex-shrink: 0;
}
.row-remove:hover { color: #e05c6a; }
.rp-export {
  margin: 12px; padding: 10px; border-radius: 10px;
  border: 1px solid #1e3250; background: #0a1628; color: #7ea8c9;
  font-size: 12px; font-weight: 600; cursor: pointer; text-align: center;
  transition: all 0.15s; flex-shrink: 0;
}
.rp-export:hover { border-color: #4ecdc4; color: #4ecdc4; }

/* ── Empty state ── */
.empty-center {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 60px 48px; gap: 20px;
}
.empty-icon { font-size: 64px; margin-bottom: 8px; }
.empty-title { font-size: 26px; font-weight: 700; color: #e8eaf0; }
.empty-sub { font-size: 15px; color: #7ea8c9; line-height: 1.6; max-width: 440px; }
.empty-sub strong { color: #4ecdc4; }
.empty-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
.empty-btn {
  padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: 1px solid; transition: all 0.15s;

// ─── STATE ──────────────────────────────────────────────────────────────────
const state = {
  screen: 'queue',       // 'queue' | 'shortlist'
  mode: 'papers',        // 'papers' | 'researchers'
  viewMode: 'researcher',// 'researcher' | 'external'
  paperIdx: 0,
  resIdx: 0,
  saved: { papers: [], researchers: [] },
  history: [],           // for undo: [{type:'paper'|'researcher',item,action:'save'|'skip'}]
  animating: false,
  panelTab: 'papers',    // 'papers' | 'researchers'
  activeFilter: { papers: 'Climate Change', researchers: 'Climate Science' },
  sortBy: 'Date Saved',
  undoTimer: null,
  showUndo: false,
  lastAction: null,
  reelView: 'feed',     // 'feed' | 'player'
  activeReelIdx: 0,
  activeAct: 0,
  reelFilter: 'All Topics',
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function currentPaper() { return PAPERS[state.paperIdx] || null; }
function currentResearcher() { return RESEARCHERS[state.resIdx] || null; }
function totalPapers() { return PAPERS.length; }
function totalResearchers() { return RESEARCHERS.length; }
function papersLeft() { return Math.max(0, totalPapers() - state.paperIdx); }
function resLeft() { return Math.max(0, totalResearchers() - state.resIdx); }
function queueEmpty() {
  if (state.mode === 'papers') return state.paperIdx >= totalPapers();
  return state.resIdx >= totalResearchers();
}

function svgIcon(name) {
  const icons = {
    paper:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
    person: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>`,
    play:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
    star:   `<svg viewBox="0 0 24 24" fill="currentColor" width="11" height="11"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>`,
  };
  return icons[name] || '';
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'shortlist') {
    app.innerHTML = renderShortlist();
  } else {
    app.innerHTML = renderQueueScreen();
  }
  bindEvents();
  if (state.showUndo) renderUndoToast();
}

function renderQueueScreen() {
  const isReels = state.mode === 'reels';
  const isExt = state.viewMode === 'external';
  const badgeLabel = state.mode === 'papers'
    ? `${papersLeft()} papers in queue`
    : state.mode === 'researchers'
    ? `${resLeft()} researchers in queue`
    : '6 reels available';
  const badgeDim = !isReels && queueEmpty();

  if (isReels) {
    const nav = `
    <nav class="topnav">
      <div class="topnav-logo">UW Research <span>Network</span></div>
      <div class="topnav-div"></div>

      <div class="topnav-actions">
        <div class="queue-badge">6 reels available</div>
        <div class="avatar">KE</div>
      </div>
    </nav>`;
    if (state.reelView === 'player') {
      return nav + renderReelsPlayer();
    }
    return nav + `<div class="app-shell two-col">${renderReelsSidebar()}${renderReelsFeed()}</div>`;
  }

  return `
  <nav class="topnav">
    <div class="topnav-logo">UW Research <span>Network</span></div>
    <div class="topnav-div"></div>
    <div class="topnav-title">Shortlist</div>

        <div class="view-pill ${isExt ? 'active-ext' : 'inactive'}" data-action="set-view-ext">
          👁 External view
        </div>
      ` : ''}
      <div class="queue-badge ${badgeDim ? 'dim' : ''}">${badgeLabel}</div>
      <div class="avatar">KE</div>
    </div>
  </nav>
  <div class="app-shell">
    ${renderSidebar()}
    <main class="main-content" id="main-content">
      ${queueEmpty()
        ? `<div class="card-scroll-area">${renderEmptyState()}</div>`
        : `<div class="card-scroll-area">${renderCardContent()}</div>
           <div class="action-bar-wrapper">${renderActionBar()}</div>`}
    </main>
    ${renderRightPanel()}
  </div>`;
}

function renderSidebar() {
  const isPapers = state.mode === 'papers';
  const paperCount = totalPapers();
  const resCount = totalResearchers();
  const reviewed = isPapers ? state.paperIdx : state.resIdx;
  const total = isPapers ? paperCount : resCount;
  const pct = total > 0 ? Math.round((reviewed / total) * 100) : 0;
  const progressLabel = pct === 100
    ? `All ${total} reviewed ✓`
    : `${reviewed} of ${total} reviewed`;
  const progressColor = pct === 100 ? 'color:#4ecdc4' : '';
  const remaining = total - reviewed;
  const filterItems = isPapers
    ? [['Climate Change','12'],['Arctic & Ice','7'],['Emissions','9'],['Public Health','5'],['Ecology','8'],['Atmospheric','4']]
    : [['Climate Science','8'],['Oceanography','5'],['Ecology','4'],['Atmospheric','3'],['Public Health','2']];
  const activeFilter = state.activeFilter[state.mode];
  const kbdRows = isPapers
    ? [['←','Skip paper'],['→','Save'],['↓','View full details'],['U','Undo last action']]
    : [['←','Pass'],['→','Save'],['↓','Full profile'],['U','Undo']];

  return `
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sec-label">Browse Mode</div>
      <div class="mode-toggle">
        <button class="mode-btn ${state.mode==='papers'?'active':''}" data-action="mode-papers">
          ${svgIcon('paper')} Papers <span class="mode-count">${paperCount}</span>
        </button>
        <button class="mode-btn ${state.mode==='researchers'?'active':''}" data-action="mode-researchers">
          ${svgIcon('person')} Researchers <span class="mode-count">${resCount}</span>
        </button>
        <button class="mode-btn ${state.mode==='reels'?'active':''}" data-action="mode-reels">
          ${svgIcon('play')} Reels <span class="mode-count">6</span>
        </button>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sec-label">Filter by Topic</div>
      <div class="filter-list">
        ${filterItems.map(([label, count]) => `
          <div class="filter-item ${label===activeFilter?'active':''}" data-action="filter" data-filter="${label}">
            ${label} <span class="filter-count">${count}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sec-label">Queue Progress</div>
      <div style="font-size:13px;font-weight:600;margin-bottom:4px;${progressColor}">${progressLabel}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-meta">
        <span>${pct}% complete</span>
        <span>${pct===100 ? `${state.saved[state.mode].length} saved` : `${remaining} remaining`}</span>
      </div>
    </div>
    ${pct===100 ? `<div class="sidebar-section">
      <div class="sec-label">Expand Filters</div>
      <div class="filter-list">
        <div class="filter-item" data-action="filter-expand">Atmospheric <span class="filter-count">4</span></div>
        <div class="filter-item" data-action="filter-expand">Oceanography <span class="filter-count">6</span></div>
        <div class="filter-item" data-action="filter-expand">Geology <span class="filter-count">3</span></div>
      </div>
    </div>` : ''}
    <div class="sidebar-section push-bottom">
      <div class="sec-label">Keyboard Shortcuts</div>
      <div class="kbd-hints">
        ${kbdRows.map(([k,h])=>`<div class="kbd-row"><span class="kbd">${k}</span>${h}</div>`).join('')}
      </div>
    </div>
  </aside>`;
}

        <div class="sec-label">Up Next</div>
      </div>
      <div class="player-up-next-list">
        ${others.map(r => {
          const i = REELS.indexOf(r);
          return `
          <div class="up-next-card" data-action="open-player" data-idx="${i}">
            <div class="up-next-thumb">${r.emoji}</div>
            <div>
              <div class="up-next-title">${r.topic}</div>
              <div class="up-next-author">${r.name} · ${r.duration}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="back-link" data-action="back-to-feed">← Back to Feed</div>
    </div>
    <div class="player-area">
      <div class="player-layout">
        <div class="player-col">
          <div class="player-viewport">
            <div class="player-viz-bars">
              ${bars.map((h,i)=>`<div class="player-bar" style="height:${h}%;background:${i%3===0?'#4ecdc4':i%3===1?'#1e4a6e':'#7ea8c9'}"></div>`).join('')}
            </div>
            <div class="player-overlay-top">
              <div class="player-act-badge">ACT ${state.activeAct + 1} · ${reel.acts[state.activeAct].toUpperCase()}</div>
              <div class="player-close" data-action="back-to-feed">✕</div>
            </div>
            <div class="player-overlay-bottom">
              <div class="player-title">${reel.topic}</div>
              <div class="player-hook">${reel.hook}</div>
              <div class="player-researcher">
                <div class="player-res-avatar">${reel.initials}</div>
                <div>
                  <div class="player-res-name">${reel.name}</div>
                  <div class="player-res-dept">${reel.dept}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="player-controls-wrap">
            <div class="act-timeline">
              ${reel.acts.map((_, i) => `<div class="act-seg" data-action="reel-act" data-act="${i}" style="cursor:pointer"><div class="act-seg-fill" style="width:${i < state.activeAct ? '100%' : i === state.activeAct ? '40%' : '0%'}"></div></div>`).join('')}
            </div>
            <div class="act-labels">
              ${reel.acts.map((act, i) => `<div class="act-label-item${i === state.activeAct ? ' active' : ''}" data-action="reel-act" data-act="${i}" style="cursor:pointer">${act}</div>`).join('')}
            </div>
            <div class="controls-row">
              <div class="ctrl-btn">⏮</div>
              <div class="ctrl-btn play-pause">⏸</div>
              <div class="ctrl-btn">⏭</div>
              <div class="ctrl-time">1:42 / ${reel.duration}</div>
              <div class="ctrl-spacer"></div>
              <div class="ctrl-btn" title="Captions" style="font-size:12px;font-weight:700">CC</div>
              <div class="ctrl-btn" title="Fullscreen">⛶</div>
            </div>
          </div>
        </div>
        <div class="player-right-panel">
          <div class="panel-section-label">Reel Structure</div>
          ${reel.acts.map((act, i) => `
          <div class="act-row ${i===state.activeAct?'active':''}" data-action="reel-act" data-act="${i}" style="cursor:pointer">
            <div class="act-num ${i===state.activeAct?'active':''}">${i+1}</div>
            <div style="flex:1">
              <div class="act-name">${act}</div>
              <div class="act-desc">${reel.actDescs[i]}</div>
            </div>
            <div class="act-status ${i===state.activeAct?'playing':'upcoming'}">${i===state.activeAct?'PLAYING':'UPCOMING'}</div>
          </div>`).join('')}
          <div class="panel-cta-group">
            <button class="btn-panel-primary" data-action="save-reel" data-idx="${state.activeReelIdx}">
              ${reel.saved ? '♥ Saved' : '♥ Save'}
            </button>
            <button class="btn-panel-ghost">↗ Share this Reel</button>
            <button class="btn-panel-ghost">📄 View Full Paper</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderEmptyState() {
  const isPapers = state.mode === 'papers';
  const savedCount = state.saved[state.mode].length;
  const switchMode = isPapers ? 'researchers' : 'papers';
  const switchLeft = isPapers ? resLeft() : papersLeft();
  return `
    <div class="empty-center">
      <div class="empty-icon">${isPapers ? '🔬' : '🎉'}</div>
      <div class="empty-title">You're all caught up!</div>
      <div class="empty-sub">You've reviewed all ${isPapers?totalPapers():totalResearchers()} ${state.mode} in your queue and saved <strong>${savedCount} ${state.mode}</strong> to your shortlist.</div>
      <div class="empty-actions">
        <button class="empty-btn primary" data-action="view-shortlist">View Saved ${isPapers?'Papers':'Researchers'} (${savedCount})</button>
        <button class="empty-btn secondary" data-action="expand-filters">Expand Filters & Reload Queue</button>
        ${switchLeft > 0 ? `<button class="empty-btn secondary" data-action="mode-${switchMode}">Switch to ${isPapers?'Researcher':'Paper'} Mode (${switchLeft} queued)</button>` : ''}
      </div>
    </div>`;
}

function renderRightPanel() {
  const tab = state.panelTab;
  const papers = state.saved.papers;
  const researchers = state.saved.researchers;
  const totalSaved = papers.length + researchers.length;
  const items = tab === 'papers' ? papers : researchers;

  return `
  <aside class="right-panel">
    <div class="rp-header">
      <h3>My Shortlist</h3>
      <span class="panel-count">${totalSaved} saved</span>
    </div>
    <div class="rp-tabs">
      <div class="panel-tab ${tab==='papers'?'active':''}" data-action="panel-tab-papers">Papers (${papers.length})</div>
      <div class="panel-tab ${tab==='researchers'?'active':''}" data-action="panel-tab-researchers">Researchers (${researchers.length})</div>
    </div>
    <div class="rp-list">
      ${items.length === 0 ? `
        <div class="rp-empty">
          <div class="rp-empty-icon">${tab==='papers'?'📄':'👤'}</div>
          <div class="rp-empty-text">No ${tab} saved yet.<br>Use → or the Save button to add items.</div>
        </div>` :
        items.map((item, i) => `
          <div class="saved-row">
            <div class="row-icon">${tab==='papers'?'📄':'👤'}</div>
            <div class="row-body">
              <div class="row-title">${tab==='papers' ? item.title : item.name}</div>
              <div class="row-meta">${tab==='papers' ? `${item.journal} · ${item.year} · <span>${item.citations} citations</span>` : `${item.affil}`}</div>
            </div>
            <button class="row-remove" data-action="remove-saved" data-tab="${tab}" data-idx="${i}" title="Remove">×</button>
          </div>`).join('')
      }
    </div>
    ${totalSaved > 0 ? `<div class="rp-export" data-action="view-shortlist">View Full Shortlist →</div>` : ''}
  </aside>`;
}

function renderShortlist() {
  const papers = state.saved.papers;
  const researchers = state.saved.researchers;
  const allItems = [
    ...papers.map(p => ({ type: 'paper', ...p })),
    ...researchers.map(r => ({ type: 'researcher', ...r })),
  ];

  return `
  <nav class="topnav">
    <div class="topnav-logo">UW Research <span>Network</span></div>
    <div class="topnav-div"></div>
    <div class="topnav-title">My Shortlist</div>
    <div class="topnav-actions">
      <div class="queue-badge">${allItems.length} items total</div>
      <div class="avatar">KE</div>
    </div>
  </nav>
  <div class="app-shell two-col">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sec-label">View</div>
        <div class="mode-toggle">
          <button class="mode-btn ${state.mode==='papers'?'active':''}" data-action="mode-papers">${svgIcon('paper')} Papers <span class="mode-count">${papers.length}</span></button>
          <button class="mode-btn ${state.mode==='researchers'?'active':''}" data-action="mode-researchers">${svgIcon('person')} Researchers <span class="mode-count">${researchers.length}</span></button>
          <button class="mode-btn" data-action="mode-reels">${svgIcon('play')} Reels <span class="mode-count">—</span></button>
        </div>
      </div>
      <div class="sidebar-section sidebar-sort">
        <div class="sec-label">Sort By</div>
        <div class="filter-list">
          ${['Date Saved','Citation Count','Year Published','Relevance'].map(s=>`
            <div class="filter-item ${state.sortBy===s?'active':''}" data-action="sort" data-sort="${s}">${s}</div>`).join('')}
        </div>
      </div>
      <div class="sidebar-section push-bottom">
        <div class="sec-label">Export</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button class="export-btn" style="width:100%;text-align:left;" data-action="export-bib">BibTeX (.bib)</button>
          <button class="export-btn" style="width:100%;text-align:left;" data-action="export-csv">CSV Spreadsheet</button>
          <button class="export-btn" style="width:100%;text-align:left;" data-action="export-link">Share Link</button>
        </div>
      </div>
    </aside>
    <main style="background:#0a1628;overflow-y:auto;display:flex;flex-direction:column;">
      <div class="shortlist-main">
        <div class="shortlist-header">
          <h2>Saved ${state.mode === 'papers' ? 'Papers' : 'Researchers'}</h2>
          <div class="shortlist-header-actions">
            <button class="export-btn" data-action="export-all">Export All</button>
            <button class="back-btn" data-action="back-to-queue">← Back to Queue</button>
          </div>
        </div>
        ${(state.mode === 'papers' ? papers : researchers).length === 0 ? `
          <div style="text-align:center;padding:60px 0;color:#3a5a78;font-size:15px;">
            No ${state.mode} saved yet. <span style="color:#4ecdc4;cursor:pointer;" data-action="back-to-queue">Go back to the queue →</span>
          </div>` :
          (state.mode === 'papers' ? papers : researchers).map((item, i) => `
            <div class="full-row">
              <div class="full-icon">${state.mode === 'papers' ? '📄' : '👤'}</div>
              <div class="full-body">
                <div class="full-title">${state.mode === 'papers' ? item.title : item.name}</div>
                <div class="full-meta">
                  ${state.mode === 'papers'
                    ? `${item.journal} · ${item.year} · <span>${item.citations} citations</span> · UW Author: ${item.author.name}`
                    : `${item.affil} · h-Index: ${item.hIndex}`}
                </div>
              </div>
              <div class="full-actions">
                <span class="tag-chip">${item.tag}</span>
                <button class="remove-btn" data-action="remove-full" data-type="${state.mode==='papers'?'papers':'researchers'}" data-idx="${i}">Remove</button>
              </div>
            </div>`).join('')
        }
        ${allItems.length > 0 ? `
          <div class="export-bar">
            <button class="export-btn" data-action="export-bib">Export as BibTeX</button>
            <button class="export-btn" data-action="export-csv">Export as CSV</button>
            <button class="export-btn" data-action="export-link">Share Shortlist Link</button>
          </div>` : ''}
      </div>
    </main>
  </div>`;
}

function renderUndoToast() {
  const existing = document.getElementById('undo-toast');
  if (existing) existing.remove();
  if (!state.showUndo || !state.lastAction) return;
  const { action, item, type } = state.lastAction;
  const label = action === 'save'
    ? (type === 'papers' ? `Saved "${item.title.substring(0,40)}…"` : `Connected with ${item.name}`)
    : (type === 'papers' ? `Skipped "${item.title.substring(0,40)}…"` : `Passed on ${item.name}`);
  const toast = document.createElement('div');
  toast.id = 'undo-toast';
  toast.className = 'undo-toast';
  toast.innerHTML = `<span>${label}</span><button class="undo-btn" id="undo-btn">Undo</button>`;
  document.body.appendChild(toast);
  document.getElementById('undo-btn').onclick = handleUndo;
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function animateCard(direction, callback) {
  if (state.animating) return;
  state.animating = true;
  const card = document.getElementById('main-card');
  const badgeNope = document.getElementById('badge-nope');
  const badgeLike = document.getElementById('badge-like');
  if (!card) { state.animating = false; callback(); return; }
  if (direction === 'left' && badgeNope) badgeNope.classList.add('show');
  if (direction === 'right' && badgeLike) badgeLike.classList.add('show');
  card.classList.add(direction === 'left' ? 'exit-left' : 'exit-right');
  setTimeout(() => {
    state.animating = false;
    callback();
    render();
    // animate in the new card
    setTimeout(() => {
      const newCard = document.getElementById('main-card');
      if (newCard) newCard.classList.add('enter-card');
    }, 10);
  }, 320);
}

function doSkip() {
  if (state.animating || queueEmpty()) return;
  const item = state.mode === 'papers' ? currentPaper() : currentResearcher();
  const type = state.mode;
  animateCard('left', () => {
    state.history.push({ action: 'skip', type, item });
    state.lastAction = { action: 'skip', type, item };
    if (state.mode === 'papers') state.paperIdx++;
    else state.resIdx++;
    showUndo();
  });
}

function doSave() {
  if (state.animating || queueEmpty()) return;
  const item = state.mode === 'papers' ? currentPaper() : currentResearcher();
  const type = state.mode;
  animateCard('right', () => {
    state.saved[type].push(item);
    state.history.push({ action: 'save', type, item });
    state.lastAction = { action: 'save', type, item };
    if (state.mode === 'papers') state.paperIdx++;
    else state.resIdx++;
    showUndo();
  });
}

function showUndo() {
  state.showUndo = true;
  if (state.undoTimer) clearTimeout(state.undoTimer);
  state.undoTimer = setTimeout(() => { state.showUndo = false; renderUndoToast(); }, 4000);
}

function handleUndo() {
  if (!state.history.length) return;
  const last = state.history.pop();
  state.lastAction = null;
  state.showUndo = false;
  if (state.undoTimer) clearTimeout(state.undoTimer);
  const toast = document.getElementById('undo-toast');
  if (toast) toast.remove();
  if (last.action === 'save') {
    const arr = state.saved[last.type];
    const idx = arr.findIndex(x => x.id === last.item.id);
    if (idx !== -1) arr.splice(idx, 1);
  }
  if (last.type === 'papers') state.paperIdx = Math.max(0, state.paperIdx - 1);
  else state.resIdx = Math.max(0, state.resIdx - 1);
  render();
}

// ─── EVENT BINDING ───────────────────────────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleAction);
  });
}

function handleAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  switch (action) {
    case 'skip':          doSkip(); break;
    case 'save':          doSave(); break;
    case 'details':       /* no-op in wireframe */ break;
    case 'set-view-res':  state.viewMode = 'researcher'; render(); break;
    case 'set-view-ext':  state.viewMode = 'external';   render(); break;
    case 'mode-papers':
      state.mode = 'papers'; if (state.screen !== 'shortlist') state.screen = 'queue'; render(); break;
    case 'mode-researchers':
      state.mode = 'researchers'; if (state.screen !== 'shortlist') state.screen = 'queue'; render(); break;
    case 'mode-reels':    state.mode = 'reels'; state.reelView = 'feed'; state.screen = 'queue'; render(); break;
    case 'open-player':   state.reelView = 'player'; state.activeReelIdx = +el.dataset.idx; state.activeAct = 0; render(); break;
    case 'reel-act':      state.activeAct = +el.dataset.act; render(); break;
    case 'back-to-feed':  state.reelView = 'feed'; render(); break;
    case 'reel-filter':   state.reelFilter = el.dataset.filter; render(); break;
    case 'save-reel': {
      const reelIdx = +el.dataset.idx;
      const reel = REELS[reelIdx];
      reel.saved = true;
      if (!state.saved.researchers.find(r => r.name === reel.name)) {
        state.saved.researchers.push({ id: 200 + reelIdx, initials: reel.initials, name: reel.name, affil: `University of Washington · ${reel.dept}`, hIndex: '—', tag: reel.topic_badge });
      }
      if (state.reelView === 'player') {
        const nextIdx = (reelIdx + 1) % REELS.length;
        state.activeReelIdx = nextIdx;
        state.activeAct = 0;
      }
      render(); break;
    }
    case 'share-reel':    break;
    case 'filter':
      state.activeFilter[state.mode] = el.dataset.filter; render(); break;
    case 'filter-expand':
    case 'expand-filters':
      // reset queue for demo
      if (state.mode === 'papers') state.paperIdx = 0; else state.resIdx = 0;
      render(); break;
    case 'panel-tab-papers':     state.panelTab = 'papers';     render(); break;
    case 'panel-tab-researchers':state.panelTab = 'researchers'; render(); break;
    case 'view-shortlist': state.screen = 'shortlist'; render(); break;
    case 'back-to-queue':  state.screen = 'queue';     render(); break;
    case 'sort': state.sortBy = el.dataset.sort; render(); break;
    case 'remove-saved': {
      const tab = el.dataset.tab;
      const idx = parseInt(el.dataset.idx);
      state.saved[tab].splice(idx, 1);
      render(); break;
    }
    case 'remove-full': {
      const type = el.dataset.type;
      const idx = parseInt(el.dataset.idx);
      state.saved[type].splice(idx, 1);
      render(); break;
    }
    case 'export-bib':
    case 'export-csv':
    case 'export-link':
    case 'export-all':
      alert('Export feature coming soon!'); break;
  }
}

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (state.screen !== 'queue' || queueEmpty()) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key) {
    case 'ArrowLeft':  e.preventDefault(); doSkip(); break;
    case 'ArrowRight': e.preventDefault(); doSave(); break;
    case 'ArrowDown':  e.preventDefault(); break; // details
    case 'u': case 'U': handleUndo(); break;
  }
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
